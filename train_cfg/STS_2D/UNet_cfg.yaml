# ---- 数据集配置 ----
# 数据集名称，对应 build_dataset.py 中的注册表。可选: CamVid_11 / STS_2D
dataset_name: STS_2D

# 数据集根目录
data_root: D:/1AAAAAstudy/python_base/pytorch/all_dataset/semantic_segmentation/ready_dataset/seg_2d_datasets/STS-2D

# 类别数。STS-2D 为二值分割（背景 + 前景）。
num_classes: 2

# 输入尺寸，格式为 [height, width]。STS-2D 原始分辨率 320x640。
image_size: [320, 640]

# loss 中忽略的标签值。
ignore_index: 255

# ---- 模型配置 ----
# 运行设备。"auto" 会优先使用 CUDA，否则使用 CPU。
device: auto

# 全局随机种子。
seed: 42

# 实验名称。
exp_name: sts2d_unet

# 是否在 exp_name 后追加当前时间。
append_exp_time: true

# 实验备注。
exp_note: STS-2D binary segmentation (UNet)

# 模型名称，对应 nets/build_model.py 中的 MODEL_REGISTRY。
model_name: UNet

# 输入图像通道数。RGB 图像为 3。
in_channels: 3

# 是否加载 VGG16 预训练权重。
pretrained: true

# ---- 训练配置 ----
# 每个 batch 的样本数。
batch_size: 16

# 训练 epoch 数。
epochs: 80

# 每隔多少个 epoch 额外保存一次模型权重。
save_interval: 10

# DataLoader worker 数。
num_workers: 0

# num_workers > 0 时是否保持 worker 进程常驻。
persistent_workers: True

# 是否启用 pinned memory。"auto" 表示 CUDA 时开启，CPU 时关闭。
pin_memory: auto

# ---- 调试配置 ----
# 调试模式。null 表示全量训练。
debug_mode: null

debug_max_train_samples: 16
debug_max_val_samples: 8
debug_max_train_batches: null
debug_max_val_batches: null

# ---- loss 配置 ----
loss:
  type: CrossEntropyLoss

# ---- 优化器配置 ----
optimizer:
  type: Adam
  lr: 0.0001
  weight_decay: 0.0001

  lr_scheduler:
    type: PolyLR
    power: 0.9
    min_lr: 0.000001
