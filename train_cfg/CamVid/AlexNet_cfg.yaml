# 运行设备。"auto" 会优先使用 CUDA，否则使用 CPU；也可以手动写 "cuda" 或 "cpu"。
device: auto

# 全局随机种子，用于 random / numpy / torch 的基础可复现设置。
seed: 42

# 实验名称。append_exp_time=true 时，最终日志目录会自动追加时间戳。
exp_name: camvid_alexnet

# 是否在 exp_name 后追加当前时间，避免不同训练覆盖同一个日志目录。
append_exp_time: true

# 实验备注，会保存到 logs_upload/<exp_name>/config.json 中。
exp_note: CamVid AlexNet FCN baseline

# 模型名称，对应 nets/build_model.py 中的 MODEL_REGISTRY。
model_name: AlexNet

# 输入图像通道数。RGB 图像为 3。
in_channels: 3

# 类别数。CamVid_11class 数据集共 11 类。
num_classes: 11

# 数据集根目录，期望包含 train / train_labels / val / val_labels / test / test_labels。
data_root: D:/1AAAAAstudy/python_base/pytorch/all_dataset/semantic_segmentation/ready_dataset/seg_2d_datasets/CamVid_11class

# 输入尺寸，格式为 [height, width]。AlexNet FCN 使用 227x227。
image_size: [227, 227]

# loss 中忽略的标签值；CrossEntropyLoss 会跳过该值对应的像素。
ignore_index: 255

# 是否把 CamVid 的 Void 类像素转成 ignore_index，不参与 loss。
ignore_void: true

# Void 类索引。null 表示从 class_dict.csv 自动查找名为 "Void" 的类别；手动填数字则优先使用手动值。
void_class_index: null

# 计算 mIoU / mean acc 时忽略的类别索引。11类数据集无需忽略。
metric_ignore_classes: []

# 每个 batch 的样本数。
batch_size: 32

# 训练 epoch 数。
epochs: 80

# 每隔多少个 epoch 额外保存一次模型权重。
save_interval: 10

# DataLoader worker 数。Windows 下调试建议 0；Linux 训练可适当增大。
num_workers: 0

# num_workers > 0 时是否保持 worker 进程常驻。
persistent_workers: True

# 是否启用 pinned memory。"auto" 表示 CUDA 时开启，CPU 时关闭。
pin_memory: auto

# 调试模式。null 表示全量训练；非 null 时会截断数据集用于快速测试。
debug_mode: null

# debug_mode 非 null 时，最多使用多少张训练图。
debug_max_train_samples: 16

# debug_mode 非 null 时，最多使用多少张验证图。
debug_max_val_samples: 8

# 每个 epoch 最多训练多少个 batch。null 表示不限制。
debug_max_train_batches: null

# 每个 epoch 最多验证多少个 batch。null 表示不限制。
debug_max_val_batches: null

# loss 配置。
loss:
  type: CrossEntropyLoss

# 优化器与学习率策略配置。
optimizer:
  # 优化器类型。当前支持 SGD / Adam / AdamW。
  type: Adam

  # 初始学习率。Adam 通常用 1e-3 ~ 1e-4。
  lr: 0.001

  # 权重衰减。
  weight_decay: 0.0001

  # 学习率调度器配置。
  lr_scheduler:
    # 调度器类型。当前支持 PolyLR / WarmupPolyLR / StepLR / CosineAnnealingLR。
    type: PolyLR

    # PolyLR 衰减指数。
    power: 0.9

    # 最小学习率。
    min_lr: 0.00001
